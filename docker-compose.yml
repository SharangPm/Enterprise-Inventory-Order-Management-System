services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports: ["${MONGO_PORT:-27017}:27017"]
    volumes: ["mongo_data:/data/db"]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 8
  mongo-init:
    image: mongo:7
    restart: "no"
    depends_on:
      mongo: { condition: service_healthy }
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        mongosh mongodb://mongo:27017 --quiet --eval
        'try { rs.status().ok } catch (e) { rs.initiate({_id:"rs0",members:[{_id:0,host:"mongo:27017"}]}) }';
        until mongosh mongodb://mongo:27017 --quiet --eval 'db.hello().isWritablePrimary' | grep -q true; do sleep 1; done
  api:
    build:
      context: ./backend
      dockerfile: Inventory.API/Dockerfile
    restart: unless-stopped
    ports: ["${API_PORT:-8081}:8080"]
    environment:
      Mongo__ConnectionString: mongodb://mongo:27017/?replicaSet=rs0
      Mongo__Database: nexstock
      Jwt__Key: ${JWT_KEY:-local-development-key-change-this-before-deployment-00000000}
      Frontend__Origin: ${FRONTEND_ORIGIN:-http://localhost:5174}
      ASPNETCORE_ENVIRONMENT: Development
    depends_on:
      mongo-init: { condition: service_completed_successfully }
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8081/api}
        VITE_SIGNALR_URL: ${VITE_SIGNALR_URL:-http://localhost:8081/hubs/notifications}
    restart: unless-stopped
    ports: ["${WEB_PORT:-5174}:80"]
    depends_on: [api]
  backend-tests:
    profiles: [test]
    build:
      context: ./backend
      dockerfile: Inventory.Tests/Dockerfile
    environment:
      TEST_MONGO: mongodb://mongo:27017/?replicaSet=rs0
    depends_on:
      mongo-init: { condition: service_completed_successfully }
volumes:
  mongo_data:
